<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        h1, h2, h3 { color: #333; }
        .book-detail > div { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #eee; }
        ul { padding-left: 1.5rem; }
        .cover-image { max-width: 200px; height: auto; }
        .author-profile { background: #f5f5f5; padding: 1rem; border-radius: 4px; }
        .publication-item { margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
